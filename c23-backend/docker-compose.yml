# C23 backend: docker compose up --build
# The API only HARD-depends on PostgreSQL (source of truth). Redis and the AI service are optional:
# stop either one and the API keeps returning correct deterministic results (ai_status/redis = degraded).
name: c23-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: c23
      POSTGRES_USER: c23
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c23_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c23 -d c23"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./decision-engine
    expose:
      - "8001"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://c23:${POSTGRES_PASSWORD:-c23_local_only}@postgres:5432/c23?sslmode=disable
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      AI_SERVICE_URL: ${AI_SERVICE_URL-http://ai:8001}
      AI_TIMEOUT_MS: "1500"
      AUTO_MIGRATE: "true"
      SEED_OFFICIAL: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
